<svg width="900" height="640" viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="900" height="640" fill="#FFFFFF"/>

  <!-- ================= PRIMARY LOCKUP ================= -->
  <g transform="translate(60,60)">
    <!-- Archway (the "stay") — open monoline doorway -->
    <path d="M20,190 L20,90 A70,70 0 0 1 160,90 L160,190"
          fill="none" stroke="#1F2A2E" stroke-width="6" stroke-linecap="round"/>
    <!-- Flight line (the "farer") — breaks out through the arch -->
    <path d="M2,205 Q95,150 176,52"
          fill="none" stroke="#C1633D" stroke-width="6" stroke-linecap="round"/>
    <circle cx="176" cy="52" r="7" fill="#C1633D"/>
  </g>

  <!-- Wordmark -->
  <text x="300" y="205" font-family="Georgia, 'Times New Roman', serif" font-weight="400"
        font-size="66" letter-spacing="6" fill="#1F2A2E">STAY FARER</text>

  <!-- Tagline -->
  <text x="303" y="242" font-family="Arial, Helvetica, sans-serif" font-weight="400"
        font-size="17" letter-spacing="4" fill="#8C8A82">BOUTIQUE STAYS, EVERY MILE</text>

  <!-- divider -->
  <line x1="60" y1="320" x2="840" y2="320" stroke="#E7E4D9" stroke-width="1"/>

  <!-- ================= APP-ICON / BADGE VARIANT ================= -->
  <rect x="350" y="360" width="200" height="200" rx="20" fill="#1F2A2E"/>
  <g transform="translate(390,398)">
    <path d="M14,130 L14,62 A48,48 0 0 1 110,62 L110,130"
          fill="none" stroke="#F5F1E8" stroke-width="6" stroke-linecap="round"/>
    <path d="M2,140 Q64,102 121,36"
          fill="none" stroke="#C1633D" stroke-width="6" stroke-linecap="round"/>
    <circle cx="121" cy="36" r="6.5" fill="#C1633D"/>
  </g>

  <text x="450" y="595" font-family="Arial, Helvetica, sans-serif" font-weight="400"
        font-size="15" letter-spacing="3" fill="#9A988E" text-anchor="middle">APP ICON / FAVICON VARIANT</text>
</svg>
